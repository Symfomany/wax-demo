# Pages de blog sans flux RSS : cartes de la page de liste crawlées en HTML (app/news.py),
# collectées par la veille (tâche collect:rss) et affichées dans l'onglet 📰 Actus.
[[blog]]
name = "Claude Blog"
url = "https://claude.com/blog"

# Onglet 📰 Actus : pages [[blog]] ci-dessus + ces flux [[rss]] (par nom).
# openai.com/fr-FR/news/ refuse les robots (HTTP 403) : on lit son flux officiel.
[news]
rss = ["OpenAI News"]

# Flux d'annonces quotidiennes arXiv (moins sujet au rate-limit que l'API).
[arxiv]
feeds = [
    "https://rss.arxiv.org/rss/cs.CL",
    "https://rss.arxiv.org/rss/cs.AI",
]
keywords = [
    "llm", "language model", "agent", "retrieval", "rag", "benchmark",
    "quantization", "inference", "reasoning", "evaluation", "mcp",
]

[github]
repositories = [
    "vllm-project/vllm",
    "huggingface/transformers",
    "langchain-ai/langgraph",
    "ollama/ollama",
]
releases_per_repo = 3

# Découverte de nouveaux dépôts open source via le serveur MCP github-scout.
# Chaque requête devient : "<requête> created:>{aujourd'hui - lookback_days} stars:>={min_stars}"
[github_mcp]
enabled = true
lookback_days = 21
min_stars = 100
per_query = 5
max_repos = 8
readme_chars = 1200
queries = [
    "llm inference",
    "agent mcp",
    "rag retrieval",
    "llm evaluation benchmark",
]
# Leçon humaine devenue règle déterministe : ces dépôts ne sont pas des signaux.
exclude_keywords = [
    "tutorial", "course", "roadmap", "awesome", "interview", "learning path",
    "教程", "学习路线", "面试",
]
