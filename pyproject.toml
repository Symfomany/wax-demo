[project]
name = "llm-watch-harness"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "feedparser",
    "httpx",
    "jinja2",
    "langchain",
    "langchain-anthropic",
    "langchain-core",
    "langchain-mcp-adapters",
    "langchain-ollama",
    "langchain-openai",
    "langfuse",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "markdown",
    "mcp",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "rich",
    "typer",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
